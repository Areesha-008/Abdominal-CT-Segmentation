# Shared training budget. Copy these values for every experiment so the three runs stay comparable.
data_root: data/Synapse
list_dir: lists
img_size: 384
num_classes: 9
batch_size: 2          # Colab T4 budget (released code used 5)
max_epochs: 20         # Colab session budget (released code used 500)
early_stop_patience: 5
early_stop_min_delta: 0.0
base_lr: 0.0003
weight_decay: 0.0001
lr_schedule: poly
topk_threshold: 0.8
seed: 1234
num_workers: 2
overlay_slices:
  - [case0008, 70]
  - [case0022, 45]
  - [case0036, 95]

# Experiment 2: only difference from Experiment 1 is this block.
preprocess:
  name: clahe
  clip_limit: 2.0
  tile_grid: 8

# Checkpointing. last.pth is rewritten every epoch (this is what --resume uses).
save_every: 5            # additionally keep ckpt_epoch005.pth, ckpt_epoch010.pth, ...
# Optional and OFF by default: stop as soon as val mean Dice exceeds this value.
# See the note in the chat before enabling; it also needs a larger max_epochs.
# target_val_dice: 0.6284